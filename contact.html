<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Zhoushan Eastern Docking Advisory</title>
  <link rel="stylesheet" href="assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <h1>Request Docking Advisory</h1>
      <p class="tagline">Get a confidential preliminary discussion</p>
    </div>
  </header>

  <nav>
    <div class="container">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="shipowners.html">Shipowners</a>
      <a href="ships.html">Ships</a>
      <a href="intelligence.html">Intelligence</a>
      <a href="cases.html">Cases</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main class="container">
    <form action="https://formspree.io/f/xgonplvd" method="POST" class="contact-form">
      <label for="company">Company *</label>
      <input type="text" id="company" name="company" required>

      <label for="vessel">Vessel Name</label>
      <input type="text" id="vessel" name="vessel">

      <label for="location">Repair Location (e.g. China, Singapore)</label>
      <input type="text" id="location" name="location">

      <label for="scope">Repair Scope / Main Works</label>
      <textarea id="scope" name="scope" rows="4"></textarea>

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required>

      <button type="submit" class="btn">Submit Request</button>
      <p class="form-note">Your information is kept strictly confidential.</p>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Zhoushan Eastern Docking Advisory. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
